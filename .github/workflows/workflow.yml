name: CD with Gradle

# pull request가 close 되었을 때 실행
on:
  pull_request:
    types: [ closed ]

# github action이 읽을 수 있도록 수정
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # 프로젝트 toolchain과 동일한 JDK 사용
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: "temurin"

      # 깃에 없는 application.yml 파일 생성
      - name: Make application.yml
        env:
          APPLICATION_YML: ${{ secrets.YML }}
        run: |
          mkdir -p src/main/resources
          printf '%s\n' "$APPLICATION_YML" > src/main/resources/application.yml
        shell: bash

      # 소스 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # dockerfile을 통해 이미지를 빌드하고, 이를 docker repo로 push
      - name: Docker build & push to docker repo
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker build -f Dockerfile -t ${{ secrets.DOCKER_REPO }}/2026wiscom .
          docker push ${{ secrets.DOCKER_REPO }}/2026wiscom

        # 서버에 접속하여 pull 한 후 docker compose로 컨테이너 재생성
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        id: deploy
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          envs: GITHUB_SHA
          script: |
            set -e

            if sudo docker compose version >/dev/null 2>&1; then
              compose() { sudo docker compose "$@"; }
            elif sudo docker-compose version >/dev/null 2>&1; then
              compose() { sudo docker-compose "$@"; }
            else
              echo "Docker Compose를 서버에 먼저 설치해야 합니다. 기존 컨테이너는 변경하지 않습니다."
              echo "설치 안내: https://docs.docker.com/compose/install/linux/"
              exit 1
            fi

            sudo docker rm -f $(sudo docker ps -qa) || true
            compose down || true
            sudo docker pull ${{ secrets.DOCKER_REPO }}/2026wiscom
            compose up -d
            sudo docker image prune -f
